name: webapp testing for writtenss

on:
  pull_request:
    branches:
      - main  

jobs:
  pr-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Shutdown Default MySQL (if running)
      run: |
        sudo service mysql stop || echo "No default MySQL service to stop."

    - name: Install MySQL
      run: |
        sudo apt-get update
        sudo apt-get install -y mysql-server
        sudo service mysql start

    - name: Configure MySQL
      env:
        DB_NAME: ${{ secrets.MYSQL_DATABASE }}    
        DB_USER: ${{ secrets.MYSQL_USER }}
        DB_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        DB_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      run: |
        # Secure MySQL installation (optional)
        sudo mysql -e "UPDATE mysql.user SET authentication_string=PASSWORD('${DB_ROOT_PASSWORD}') WHERE User='root';"
        sudo mysql -e "FLUSH PRIVILEGES;"

        # Create database and user
        sudo mysql -e "CREATE DATABASE IF NOT EXISTS \`${DB_NAME}\`;"
        sudo mysql -e "CREATE USER IF NOT EXISTS '${DB_USER}'@'localhost' IDENTIFIED BY '${DB_PASSWORD}';"
        sudo mysql -e "GRANT ALL PRIVILEGES ON \`${DB_NAME}\`.* TO '${DB_USER}'@'localhost';"
        sudo mysql -e "FLUSH PRIVILEGES;"

    - name: Configure Env
      run: |
        echo > .env
        echo "DATAB_HOST=localhost" >> .env
        echo "DATAB_USER=${{ secrets.MYSQL_USER }}" >> .env
        echo "DATAB_PASS=${{ secrets.MYSQL_PASSWORD }}" >> .env
        echo "DATAB_NAME=${{ secrets.MYSQL_DATABASE }}" >> .env
        echo "PORT=3000" >> .env

    - name: Install Dependencies
      run: npm install

    - name: Run Tests
      run: npm test

    - name: Shutdown MySQL
      run: |
        sudo service mysql stop
