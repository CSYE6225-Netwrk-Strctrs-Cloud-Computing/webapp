name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: ${{ secrets.DATAB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DATAB_PASS }}
          POSTGRES_DB: ${{ secrets.DATAB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ secrets.DATAB_USER }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16' # Specify your Node.js version here

      - name: Install dependencies
        run: npm install

      - name: Run tests
        env:
          DATAB_HOST: localhost
          DATAB_USER: ${{ secrets.DATAB_USER }}
          DATAB_PASS: ${{ secrets.DATAB_PASS }}
          DATAB_NAME: ${{ secrets.DATAB_NAME }}
          PORT: 3000
          NODE_ENV: test
          DATAB_PORT: 5432
        run: npm test
