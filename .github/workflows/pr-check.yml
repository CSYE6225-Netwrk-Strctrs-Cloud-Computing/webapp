name: webapp testing for writtenss

on:
  pull_request:
    branches:
      - main  

jobs:
  pr-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Shutdown Default MySQL
      run: |
        sudo service mysql stop

    - name: Set up MySQL
      uses: mirromutth/mysql-action@v1.1
      with:
        mysql-version: '5.7'                           # Specify the MySQL version
        mysql-root-password: ${{ secrets.MYSQL_ROOT_PASSWORD }} # Root password
        mysql-database: ${{ secrets.DATAB_NAME }}      # Database name to create
        mysql-user: ${{ secrets.DATAB_USER }}          # Username to create
        mysql-password: ${{ secrets.DATAB_PASS }}      # Password for the new user
        host-port: '3306'                               # Host port
        container-port: '3306'                          # Container port
        character-set-server: 'utf8'                    # Character set (optional)
        collation-server: 'utf8_general_ci'             # Collation (optional)

    - name: Configure Env
      run: |
        echo > .env
        echo DATAB_HOST=localhost >> .env
        echo DATAB_USER=${{ secrets.DATAB_USER }} >> .env
        echo DATAB_PASS=${{ secrets.DATAB_PASS }} >> .env
        echo DATAB_NAME=${{ secrets.DATAB_NAME }} >> .env
        echo PORT=3000 >> .env

    - name: Install Dependencies
      run: npm install

    - name: Run Tests
      run: npm test
