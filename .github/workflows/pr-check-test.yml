name: webapp testing

on:
  pull_request:
    branches:
        -main

jobs:
  pr-check:
    runs-on: ubuntu-latest
    environment: dev  

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: mysql
      run: |
        sudo apt update
        sudo apt install -y mysql-server
        sudo systemctl start mysql

    - name: Configure mysql
      env:
        DB_NAME: ${{ secrets.DATAB_NAME }}    
        DB_USER: ${{ secrets.DATAB_USER }}
        DB_PASSWORD: ${{ secrets.DATAB_PASS }}
      run: |
        sudo mysql -e "CREATE DATABASE \`${DB_NAME}\`;"
        sudo mysql -e "CREATE USER '${DB_USER}'@'localhost' IDENTIFIED BY '${DB_PASSWORD}';"
        sudo mysql -e "GRANT ALL PRIVILEGES ON \`${DB_NAME}\`.* TO '${DB_USER}'@'localhost';"
        sudo mysql -e "FLUSH PRIVILEGES;"

    - name: Configure Env
      run: |
        echo > .env
        echo DATAB_HOST=localhost >> .env
        echo DATAB_USER=${{ secrets.DATAB_USER }} >> .env
        echo DATAB_PASS=${{ secrets.DATAB_PASS }} >> .env
        echo DATAB_NAME=${{ secrets.DATAB_NAME }} >> .env
        echo PORT=3000 >> .env

    - name: Install Dep
      run: npm install

    - name: Run Test
      run: npm test
