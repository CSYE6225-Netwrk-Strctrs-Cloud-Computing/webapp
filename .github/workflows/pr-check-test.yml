name: webapp testing for writtenss

on:
  pull_request:
    branches:
      - main  

jobs:
  pr-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install MySQL
      run: |
        sudo apt update
        sudo apt install -y mysql-server
        sudo systemctl start mysql

    - name: Configure MySQL
      env:
        DB_NAME: ${{ secrets.DATAB_NAME }}    
        DB_USER: ${{ secrets.DATAB_USER }}
        DB_PASSWORD: ${{ secrets.DATAB_PASS }}
      run: |
        # Check if the database exists, create it if it doesn't
        DB_EXISTS=$(sudo mysql -sse "SELECT EXISTS(SELECT SCHEMA_NAME FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME='${DB_NAME}');")
        if [ "$DB_EXISTS" != 1 ]; then
          sudo mysql -e "CREATE DATABASE \`${DB_NAME}\`;"
        else
          echo "Database ${DB_NAME} already exists."
        fi

        # Check if the user exists, create it if it doesn't
        USER_EXISTS=$(sudo mysql -sse "SELECT EXISTS(SELECT 1 FROM mysql.user WHERE user = '${DB_USER}');")
        if [ "$USER_EXISTS" != 1 ]; then
          sudo mysql -e "CREATE USER '${DB_USER}'@'localhost' IDENTIFIED BY '${DB_PASSWORD}';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON \`${DB_NAME}\`.* TO '${DB_USER}'@'localhost';"
          sudo mysql -e "FLUSH PRIVILEGES;"
        else
          echo "User ${DB_USER} already exists."
        fi

    - name: Configure Env
      run: |
        echo > .env
        echo DATAB_HOST=localhost >> .env
        echo DATAB_USER=${{ secrets.DATAB_USER }} >> .env
        echo DATAB_PASS=${{ secrets.DATAB_PASS }} >> .env
        echo DATAB_NAME=${{ secrets.DATAB_NAME }} >> .env
        echo PORT=3000 >> .env

    - name: Install Dependencies
      run: npm install

    - name: Run Tests
      run: npm test
