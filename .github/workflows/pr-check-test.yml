name: Run web app unit Tests

on:
  pull_request:
    branches:
      - main 

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'  

    - name: Install dependencies
      run: npm install

    - name: Run tests
      env:
        NODE_ENV: ${{ secrets.NODE_ENV }}  
      run: npm test